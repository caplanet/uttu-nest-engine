# Fork of jagua-rs 1.1.0 (https://github.com/JeroenGar/jagua-rs, tag v1.1.0).
# Changes from upstream are listed in CAPLANET_CHANGES.md.
[package]
name = "jagua-rs"
version = "1.1.0"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
repository = "https://github.com/JeroenGar/jagua-rs"
authors = ["Jeroen Gardeyn"]
description = "A fast and fearless Collision Detection Engine for 2D irregular Cutting and Packing problems"
readme = "README.md"
publish = false

[dependencies]
ndarray = "0.17"
rand_distr = "0.6"
getrandom = { version = "0.4", default-features = false, features = ["wasm_js"] }
serde = { version = "1.0", features = ["derive"] }
ordered-float = "5.0"
log = "0.4"
slotmap = "1.0"
float-cmp = "0.10"
itertools = "0.15"
svg = "0.18"
anyhow = "1.0"
thiserror = "2"
document-features = "0.2"
rayon = "1.11"
geo-types = "0.7"
geo = { version = "0.33", default-features = false }
web-time = "1.1"

[dev-dependencies]
serde_json = "1.0"

[features]
## Enables support for the Strip Packing Problem
spp = []
## Enables support for the Bin Packing Problem
bpp = []
